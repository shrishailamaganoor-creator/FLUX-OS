<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        try {
          var currentFetch = typeof window.fetch === 'function' ? window.fetch.bind(window) : window.fetch;
          var desc =
            Object.getOwnPropertyDescriptor(window, 'fetch') ||
            Object.getOwnPropertyDescriptor(Window.prototype, 'fetch');
          if (!desc || desc.configurable !== false) {
            Object.defineProperty(window, 'fetch', {
              configurable: true,
              enumerable: true,
              get: function () {
                return currentFetch;
              },
              set: function (fn) {
                currentFetch = fn;
              }
            });
          }
        } catch (e) {}
        window.addEventListener(
          'error',
          function (event) {
            if (
              event &&
              ((event.filename && event.filename.indexOf('chrome-extension://') === 0) ||
                (event.message &&
                  (event.message.indexOf('Cannot set property fetch') !== -1 ||
                    event.message.indexOf('ServiceWorker') !== -1)))
            ) {
              event.stopImmediatePropagation();
              event.preventDefault();
            }
          },
          true
        );
        window.addEventListener(
          'unhandledrejection',
          function (event) {
            var msg = event && event.reason && (event.reason.message || String(event.reason));
            if (
              msg &&
              (msg.indexOf('Cannot set property fetch') !== -1 ||
                msg.indexOf('ServiceWorker') !== -1)
            ) {
              event.stopImmediatePropagation();
              event.preventDefault();
            }
          },
          true
        );
        try {
          if ('caches' in window) {
            caches
              .keys()
              .then(function (keys) {
                keys.forEach(function (k) {
                  if (k !== 'flux-v2.8.0') caches.delete(k).catch(function () {});
                });
              })
              .catch(function () {});
          }
          if ('serviceWorker' in navigator) {
            var isPreviewHost =
              window.location.hostname.indexOf('.run.app') !== -1 || window.self !== window.top;
            navigator.serviceWorker
              .getRegistrations()
              .then(function (regs) {
                regs.forEach(function (r) {
                  if (isPreviewHost) {
                    r.unregister().catch(function () {});
                  } else {
                    r.update().catch(function () {});
                  }
                });
              })
              .catch(function () {});
          }
          window.__fluxInstallPrompt = window.__fluxInstallPrompt || null;
          window.addEventListener('beforeinstallprompt', function (e) {
            e.preventDefault();
            window.__fluxInstallPrompt = e;
            try { localStorage.removeItem('FLUX_PWA_INSTALLED_V1'); } catch (err) {}
            window.dispatchEvent(new Event('flux-install-ready'));
          });
          window.addEventListener('appinstalled', function () {
            window.__fluxInstallPrompt = null;
            try { localStorage.setItem('FLUX_PWA_INSTALLED_V1', '1'); } catch (err) {}
            window.dispatchEvent(new Event('flux-app-installed'));
          });
        } catch (e) {}
      })();
    </script>

    <!-- Atmospheric Film Grain Overlay (0.025 opacity, non-blocking) -->
    <svg class="pointer-events-none fixed inset-0 z-50 h-full w-full opacity-[0.025]" aria-hidden="true">
      <filter id="nexora-grain">
        <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch" />
      </filter>
      <rect width="100%" height="100%" filter="url(#nexora-grain)" />
    </svg>

        var link = document.createElement('link');

        document.head.appendChild(link);
