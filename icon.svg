<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Deep Midnight Indigo Space Canvas -->
    <radialGradient id="orbitBg" cx="50%" cy="48%" r="62%" fx="50%" fy="45%">
      <stop offset="0%" stop-color="#28226E" />
      <stop offset="45%" stop-color="#151142" />
      <stop offset="80%" stop-color="#0C0926" />
      <stop offset="100%" stop-color="#08061A" />
    </radialGradient>

    <!-- Subtle Metallic / Glass Rim Border -->
    <linearGradient id="rimStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#767492" stop-opacity="0.65" />
      <stop offset="50%" stop-color="#35334D" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#585672" stop-opacity="0.55" />
    </linearGradient>

    <!-- Back Half of Glass Ribbon Orbit -->
    <linearGradient id="backOrbitGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5856D6" stop-opacity="0.55" />
      <stop offset="55%" stop-color="#2835A8" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#1E2882" stop-opacity="0.9" />
    </linearGradient>

    <!-- Glossy Obsidian Planet Sphere -->
    <radialGradient id="planetSphere" cx="44%" cy="40%" r="58%" fx="34%" fy="30%">
      <stop offset="0%" stop-color="#52535E" />
      <stop offset="28%" stop-color="#2E2F37" />
      <stop offset="62%" stop-color="#121318" />
      <stop offset="88%" stop-color="#07070A" />
      <stop offset="100%" stop-color="#040406" />
    </radialGradient>

    <!-- Front Glass Ribbon Lower Extrusion (3D Thickness) -->
    <linearGradient id="frontRibbonWall" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#BBA9FF" />
      <stop offset="22%" stop-color="#8A7EFF" />
      <stop offset="55%" stop-color="#5560F5" />
      <stop offset="85%" stop-color="#3343D6" />
      <stop offset="100%" stop-color="#1D268A" />
    </linearGradient>

    <!-- Front Glass Ribbon Top Specular Face -->
    <linearGradient id="frontRibbonTop" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EFE8FF" />
      <stop offset="20%" stop-color="#C7B6FF" />
      <stop offset="55%" stop-color="#7680FF" />
      <stop offset="85%" stop-color="#4556EC" />
      <stop offset="100%" stop-color="#2A37AC" />
    </linearGradient>

    <!-- Cyan Bit Core & Glow -->
    <radialGradient id="cyanBitCore" cx="45%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#E6FFFF" />
      <stop offset="45%" stop-color="#6DF5FF" />
      <stop offset="85%" stop-color="#14C8E8" />
      <stop offset="100%" stop-color="#0891B2" stop-opacity="0" />
    </radialGradient>

    <filter id="cyanGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="planetShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#03020D" flood-opacity="0.7" />
    </filter>
  </defs>

  <!-- Rounded Squircle Container -->
  <rect x="2" y="2" width="508" height="508" rx="114" fill="url(#orbitBg)" />
  <rect x="4" y="4" width="504" height="504" rx="112" fill="none" stroke="url(#rimStroke)" stroke-width="5" />

  <!-- Tilted Orbit Frame (-16 deg around center) -->
  <g transform="translate(256, 262) rotate(-16)">
    <!-- Back Half of Glass Ribbon (Behind Planet) -->
    <path
      d="M -186 0 A 186 54 0 0 1 186 0 L 186 16 A 186 54 0 0 0 -186 16 Z"
      fill="url(#backOrbitGrad)"
      opacity="0.92"
    />
    <path
      d="M -186 0 A 186 54 0 0 1 186 0"
      fill="none"
      stroke="#6C7AFF"
      stroke-width="2"
      stroke-opacity="0.45"
    />
  </g>

  <!-- Glossy Obsidian Planet -->
  <circle cx="248" cy="254" r="102" fill="url(#planetSphere)" filter="url(#planetShadow)" />
  <circle cx="248" cy="254" r="101.5" fill="none" stroke="#6E7299" stroke-opacity="0.22" stroke-width="1.5" />

  <!-- Front Half of 3D Glass Ribbon Orbit + Cyan Bit -->
  <g transform="translate(256, 262) rotate(-16)">
    <!-- 3D Extruded Ribbon Wall -->
    <path
      d="M -186 0 A 186 54 0 0 0 186 0 L 186 20 A 186 54 0 0 1 -186 20 Z"
      fill="url(#frontRibbonWall)"
    />
    <!-- Top Glass Ribbon Rim -->
    <path
      d="M -186 0 A 186 54 0 0 0 186 0 L 172 -4 A 172 48 0 0 1 -172 -4 Z"
      fill="url(#frontRibbonTop)"
      opacity="0.95"
    />
    <!-- Specular Edge Highlight on Left Curve -->
    <path
      d="M -186 0 A 186 54 0 0 0 90 47"
      fill="none"
      stroke="#F5F0FF"
      stroke-width="2.2"
      stroke-opacity="0.7"
      stroke-linecap="round"
    />

    <!-- One Cyan Bit on the Right Front Orbit -->
    <g transform="translate(142, 34)">
      <circle cx="0" cy="0" r="19" fill="#00E5FF" opacity="0.32" filter="url(#cyanGlow)" />
      <circle cx="0" cy="0" r="10.5" fill="url(#cyanBitCore)" filter="url(#cyanGlow)" />
      <circle cx="-2" cy="-2" r="4" fill="#FFFFFF" opacity="0.9" />
    </g>
  </g>
</svg>